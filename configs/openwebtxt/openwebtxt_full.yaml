model_configs:
  hidden_size: 192
  num_attention_heads: 3
  num_hidden_layers: 3
  attention_dropout: 0.1
  hidden_dropout: 0.1
  mode: top_3

training_configs:
  output_dir: "./results_full"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  num_train_epochs: 500
  logging_dir: "./logs"
  remove_unused_columns: false
  per_device_eval_batch_size: 1

gpu:
   ids: [0,1,2,3,4,5,6,7]
