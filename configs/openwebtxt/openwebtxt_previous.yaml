model_configs:
  hidden_size: 192
  num_attention_heads: 3
  num_hidden_layers: 3
  attention_dropout: 0.1
  hidden_dropout: 0.1
  mode: previous

training_configs:
  output_dir: "./results_previous"
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  num_train_epochs: 100
  logging_dir: "./logs"
  remove_unused_columns: false
  per_device_eval_batch_size: 4

gpu:
   ids: [0,1,2,3,4,5,6,7]