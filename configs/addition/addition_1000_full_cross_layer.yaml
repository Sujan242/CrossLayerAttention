model_configs:
  hidden_size: 192
  num_attention_heads: 3
  num_hidden_layers: 3
  attention_dropout: 0.1
  hidden_dropout: 0.1
  mode: full

training_configs:
  output_dir: "./results"
  per_device_train_batch_size: 128
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  num_train_epochs: 1000
  logging_dir: "./logs"
  remove_unused_columns: false

data_configs:
  train_data_path: "data/addition/train_3digit_10000.txt"
  test_data_path: "data/addition/test_3digit_10000.txt"
  max_sequence_length: 20

eval_configs:
  max_answer_length: 5
  eval_interval: 100
  save_path: "model_weights/addition_full_cross_attention.pth"
  batch_size: 128

gpu:
  ids: [0,1]